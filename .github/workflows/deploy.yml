name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deploy at a time. `cancel-in-progress: false` is deliberate: this
# group covers the deploy job, and killing `deploy-pages` mid-flight leaves the
# Pages deployment stuck "in progress", which blocks every later run. Queued
# runs supersede each other instead, so the newest commit still wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Resolves the live Pages config. Without this the workflow can report a
      # green "deploy" for a repository whose Pages site is not enabled at all,
      # and the only symptom is a 404 on the published URL. This step fails the
      # build with an explicit message instead.
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Publishing to Pages via OIDC needs these; the build job does not.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
